[versions]
# Kotlin and Android
kotlin = "2.4.10"
android-gradle-plugin = "9.3.1"
android-compile-sdk = "37"
android-min-sdk = "21"

# Build and Analysis Tools
detekt = "2.0.0-alpha.6"
kover = "0.9.9"
build-time-tracker = "5.0.2"
git-versioning = "6.4.4"
gradle-versions = "0.60.0"
maven-publish = "0.37.0"

# Resources
resources = "0.15.0"

# Libraries
xmlutil = "1.0.2"
kotlinx-io = "0.9.1"

[libraries]
# XML Processing
xmlutil-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "xmlutil" }

# Kotlin Extensions
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }

resources = { module = "com.goncalossilva:resources", version.ref = "resources" }

[plugins]
# Kotlin
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

# Android
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }

# Code Analysis and Quality
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Build Tools
build-time-tracker = { id = "com.asarkar.gradle.build-time-tracker", version.ref = "build-time-tracker" }
git-versioning = { id = "me.qoomon.git-versioning", version.ref = "git-versioning" }
gradle-versions = { id = "io.github.ben-manes.versions", version.ref = "gradle-versions" }

# Resources and Publishing
resources = { id = "com.goncalossilva.resources", version.ref = "resources" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
